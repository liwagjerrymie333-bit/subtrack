<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubTrack – Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-page" data-protected="true" data-page="calendar">

  <aside class="sidebar">
    <div class="brand">
      <span class="logo-circle"></span>
      <div>
        <span class="brand-name">SubTrack</span>
        <span class="brand-tagline">Your Personal Subscription Manager</span>
      </div>
    </div>

    <ul class="nav">
      <li><a href="dashboard.html">Overview</a></li>
      <li><a href="subscriptions.html">Subscriptions</a></li>
      <li><a href="calendar.html" class="active">Calendar</a></li>
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </aside>

  <main class="main">
    <header class="page-header">
      <div>
        <h1>Calendar</h1>
        <p>Check when your next due date is.</p>
      </div>

      <div class="user-profile">
        <span class="avatar" id="userAvatar"></span>
        <div>
          <span class="user-name" id="userName"></span>
          <span class="user-pronouns" id="userEmail"></span>
        </div>
      </div>
    </header>

    <section class="summary-cards">
      <article class="card summary-card">
        <h3>Payment this month</h3>
        <span class="summary-value" id="paymentCount">0</span>
        <span class="summary-label" id="paymentLabel">in this month</span>
      </article>

      <article class="card summary-card">
        <h3>Spendings this month</h3>
        <span class="summary-value" id="spendingTotal">₱0.00</span>
        <span class="summary-label" id="spendingLabel">in this month</span>
      </article>
    </section>

    <div class="calendar-header">
      <button type="button" class="btn-nav" id="prevMonth" aria-label="Previous month">&#8592;</button>
      <h2 class="calendar-title" id="calendarTitle"></h2>
      <button type="button" class="btn-nav" id="nextMonth" aria-label="Next month">&#8594;</button>
    </div>

    <section class="calendar-grid" id="calendarGrid"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
